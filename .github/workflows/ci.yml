name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./agent-sentinel-sdk[test]"
      - run: python -m pytest agent-sentinel-sdk/tests/ -v --tb=short

  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent-sentinel-intelligence/requirements.txt
      - run: pip install pytest
      - run: python -m pytest agent-sentinel-intelligence/tests/ -v --tb=short

  e2e-tests:
    name: E2E Agent Tests
    runs-on: ubuntu-latest
    needs: [sdk-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./agent-sentinel-sdk"
      - run: python tests/test_agents_e2e.py
